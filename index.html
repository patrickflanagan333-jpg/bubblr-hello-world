<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closest Bubbler Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
        .card-shadow { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); }
        .loading-dot {
            animation: bounce 1.4s infinite ease-in-out both;
            display: inline-block;
        }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body class="min-h-screen p-4 flex items-center justify-center">

    <div class="w-full max-w-lg bg-white p-8 md:p-10 rounded-xl card-shadow">
        <h1 class="text-3xl font-bold text-gray-800 mb-4 text-center">Bubbler Location Finder</h1>
        <p class="text-gray-600 mb-6 text-center">Find the closest water bubbler to your current location.</p>

        <!-- Main Action Button -->
        <button id="findLocationBtn" onclick="getLocationAndCalculate()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 ease-in-out shadow-md hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-blue-500 focus:ring-opacity-50">
            Find Closest Bubbler
        </button>

        <!-- Result Display Area -->
        <div id="resultContainer" class="mt-8 border-t pt-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-3">Result</h2>
            <div id="result" class="min-h-[6rem] p-4 bg-gray-50 border border-gray-200 rounded-lg text-gray-700">
                Click the button above to start the search.
            </div>
        </div>
    </div>

    <script>
        // Global Constants
        const R = 6371; // Earth's radius in kilometers
        const resultElement = document.getElementById('result');
        const findLocationBtn = document.getElementById('findLocationBtn');

        // Data from the provided CSV file (Parsed and cleaned)
        const bubblerData = [
            { asset: "Watter Bubbler", name: "527 Old South Head Road", lat: -33.873374, lon: 151.273744 },
            { asset: "Water Bubblr", name: "127 Bondi Road", lat: -33.893818, lon: 151.262644 },
            { asset: "Water Bubblr", name: "Niblick Street Reserve", lat: -33.883811, lon: 151.271814 },
            { asset: "Water Bubblr", name: "Gilgandra Reserve", lat: -33.882529, lon: 151.272013 },
            { asset: "Water Bubblr", name: "Fingleton Reserve", lat: -33.891976, lon: 151.253885 },
            { asset: "Water Bubblr", name: "Murriverie Road & Glenayr Avenue Reserve", lat: -33.882068, lon: 151.275869 },
            { asset: "Water Bubblr", name: "Marlborough Reserve", lat: -33.899403, lon: 151.259526 },
            { asset: "Water Bubblr", name: "Macpherson Park", lat: -33.906324, lon: 151.259871 },
            { asset: "Water Bubblr", name: "St James Road Reserve", lat: -33.892023, lon: 151.242583 },
            { asset: "Water Bubblr", name: "Caffyn Park", lat: -33.872466, lon: 151.279356 },
            { asset: "Water Bubblr", name: "Chaleyer Street Reserve", lat: -33.877578, lon: 151.275619 },
            { asset: "Water Bubblr", name: "Varna Park", lat: -33.906348, lon: 151.257321 },
            { asset: "Water Bubblr", name: "Arthur McElhone Reserve", lat: -33.86975443, lon: 151.226618 },
            { asset: "Water Bubblr", name: "Beare Park", lat: -33.87042387, lon: 151.2289547 },
        ];

        /**
         * Converts degrees to radians.
         * @param {number} deg - Degrees.
         * @returns {number} Radians.
         */
        function toRad(deg) {
            return deg * (Math.PI / 180);
        }

        /**
         * Calculates the distance between two lat/lon points using the Haversine formula.
         * @param {number} lat1 - Latitude of point 1.
         * @param {number} lon1 - Longitude of point 1.
         * @param {number} lat2 - Latitude of point 2.
         * @param {number} lon2 - Longitude of point 2.
         * @returns {number} Distance in kilometers.
         */
        function getDistance(lat1, lon1, lat2, lon2) {
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; // Distance in km
        }

        /**
         * Finds the closest bubbler to the user's current location.
         * @param {number} userLat - User's latitude.
         * @param {number} userLon - User's longitude.
         * @param {Array<Object>} data - Array of bubbler objects.
         * @returns {Object|null} The closest bubbler object including distance, or null if data is empty.
         */
        function findClosestBubbler(userLat, userLon, data) {
            if (!data || data.length === 0) return null;

            let closest = null;
            let minDistance = Infinity;

            for (const bubbler of data) {
                // Ensure the coordinates are valid numbers before calculation
                if (typeof bubbler.lat !== 'number' || typeof bubbler.lon !== 'number') {
                    console.error("Skipping invalid bubbler data:", bubbler);
                    continue;
                }

                const distance = getDistance(userLat, userLon, bubbler.lat, bubbler.lon);

                if (distance < minDistance) {
                    minDistance = distance;
                    closest = {
                        ...bubbler,
                        distance: minDistance
                    };
                }
            }

            return closest;
        }

        /**
         * The primary function to get the user's location and start the calculation.
         */
        function getLocationAndCalculate() {
            if (!navigator.geolocation) {
                resultElement.innerHTML = `<p class="text-red-600 font-semibold">
                    Geolocation is not supported by your browser.
                </p>`;
                return;
            }

            // 1. Show the calculating state (to prevent the stuck message)
            findLocationBtn.disabled = true;
            findLocationBtn.classList.add('opacity-60', 'cursor-not-allowed');
            resultElement.innerHTML = `
                <div class="flex items-center space-x-2 text-blue-600 font-medium">
                    <span class="loading-dot w-3 h-3 bg-blue-500 rounded-full"></span>
                    <span class="loading-dot w-3 h-3 bg-blue-500 rounded-full"></span>
                    <span class="loading-dot w-3 h-3 bg-blue-500 rounded-full"></span>
                    <span>Calculating current position...</span>
                </div>
            `;


            // 2. Define Geolocation success callback
            const successCallback = (position) => {
                const userLat = position.coords.latitude;
                const userLon = position.coords.longitude;

                const closestBubbler = findClosestBubbler(userLat, userLon, bubblerData);

                // 3. Update UI with result and restore button state
                findLocationBtn.disabled = false;
                findLocationBtn.classList.remove('opacity-60', 'cursor-not-allowed');

                if (closestBubbler) {
                    const distanceKm = closestBubbler.distance.toFixed(3);
                    const distanceMeters = (closestBubbler.distance * 1000).toFixed(0);

                    resultElement.innerHTML = `
                        <p class="text-lg font-bold text-green-700">Success! Location found.</p>
                        <ul class="list-disc pl-5 mt-2 space-y-1">
                            <li><strong>Closest Location:</strong> ${closestBubbler.name} (${closestBubbler.asset})</li>
                            <li><strong>Distance:</strong> ${distanceMeters} meters / ${distanceKm} km</li>
                            <li><strong>Your Location:</strong> ${userLat.toFixed(6)}, ${userLon.toFixed(6)}</li>
                            <li><strong>Bubbler Coordinates:</strong> ${closestBubbler.lat}, ${closestBubbler.lon}</li>
                        </ul>
                    `;
                } else {
                    resultElement.innerHTML = `
                        <p class="text-orange-600 font-semibold">Could not find any bubbler data to compare against.</p>
                    `;
                }
            };

            // 4. Define Geolocation error callback (THE FIX FOR THE STUCK STATE)
            const errorCallback = (error) => {
                // Restore button state
                findLocationBtn.disabled = false;
                findLocationBtn.classList.remove('opacity-60', 'cursor-not-allowed');

                let errorMessage = "An unknown error occurred.";
                switch (error.code) {
                    case error.PERMISSION_DENIED:
                        errorMessage = "Access to your location was denied. Please allow location access in your browser settings and try again.";
                        break;
                    case error.POSITION_UNAVAILABLE:
                        errorMessage = "Location information is unavailable. Try again later.";
                        break;
                    case error.TIMEOUT:
                        errorMessage = "The request to get user location timed out. Try again or ensure you have a strong signal.";
                        break;
                    default:
                        errorMessage = `Geolocation Error (Code ${error.code}): ${error.message}`;
                        break;
                }

                resultElement.innerHTML = `
                    <p class="text-red-600 font-semibold">Location Error:</p>
                    <p class="text-sm mt-1">${errorMessage}</p>
                `;
                console.error("Geolocation Error:", error);
            };

            // 5. Call getCurrentPosition with options
            navigator.geolocation.getCurrentPosition(
                successCallback,
                errorCallback,
                {
                    enableHighAccuracy: true,
                    timeout: 10000, // Increased timeout to 10 seconds for reliability
                    maximumAge: 0 // Force a fresh location attempt
                }
            );
        }
    </script>
</body>
</html>
